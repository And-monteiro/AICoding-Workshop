name: Deploy to Azure (prod)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (commit SHA, short or full)"
        required: true

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: acraiworkshop.azurecr.io
  RESOURCE_GROUP: ai-workshop-baseline

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name aiworkshop-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/backend:${{ inputs.tag }}

      - name: Deploy frontend
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name aiworkshop-frontend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/frontend:${{ inputs.tag }}
