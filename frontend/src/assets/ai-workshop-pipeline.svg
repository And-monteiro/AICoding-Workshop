<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img">
  <title>From prompt to production: an AI-assisted delivery loop</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#181A1F" />
    </marker>
  </defs>

  <rect width="1600" height="900" rx="32" fill="#F5F5ED" />
  <rect x="0" y="0" width="1600" height="900" rx="32" fill="none" stroke="#E2E2D6" stroke-width="2" />

  <!-- Header -->
  <text x="40" y="92" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="#181A1F">From prompt to production</text>
  <text x="40" y="136" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#4B5060">An AI-assisted delivery loop with a test gate in the middle</text>
  <rect x="40" y="166" width="90" height="8" rx="4" fill="#FF2400" />
  <rect x="140" y="166" width="90" height="8" rx="4" fill="#234BFF" />
  <rect x="240" y="166" width="90" height="8" rx="4" fill="#00D0F0" />
  <rect x="340" y="166" width="90" height="8" rx="4" fill="#C3FFE0" />

  <!-- Connectors -->
  <g stroke="#181A1F" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="304" y1="415" x2="350" y2="415" />
    <line x1="619" y1="415" x2="665" y2="415" />
    <line x1="934" y1="415" x2="980" y2="415" />
    <line x1="1249" y1="415" x2="1295" y2="415" />
  </g>

  <!-- Card 1: Prompt -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="40" y="250" width="260" height="330" rx="20" fill="#FFFFFF" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="84" cy="300" r="24" fill="#234BFF" />
    <text x="84" y="309" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="64" y="380" font-size="28" font-weight="700" fill="#181A1F">Prompt</text>
    <text x="64" y="408" font-size="16" fill="#4B5060">Describe the change</text>
    <line x1="64" y1="428" x2="276" y2="428" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="70" cy="461" r="4" fill="#234BFF" /><text x="84" y="466" font-size="16" fill="#2B2F3A">Plain-language request</text>
    <circle cx="70" cy="491" r="4" fill="#234BFF" /><text x="84" y="496" font-size="16" fill="#2B2F3A">CLAUDE.md sets the rules</text>
    <circle cx="70" cy="521" r="4" fill="#234BFF" /><text x="84" y="526" font-size="16" fill="#2B2F3A">On a feature branch</text>
  </g>

  <!-- Card 2: Plan and code -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="355" y="250" width="260" height="330" rx="20" fill="#FFFFFF" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="399" cy="300" r="24" fill="#00D0F0" />
    <text x="399" y="309" font-size="24" font-weight="700" fill="#181A1F" text-anchor="middle">2</text>
    <text x="379" y="380" font-size="28" font-weight="700" fill="#181A1F">Code</text>
    <text x="379" y="408" font-size="16" fill="#4B5060">Claude writes it</text>
    <line x1="379" y1="428" x2="591" y2="428" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="385" cy="461" r="4" fill="#00A1BA" /><text x="399" y="466" font-size="16" fill="#2B2F3A">React + TypeScript UI</text>
    <circle cx="385" cy="491" r="4" fill="#00A1BA" /><text x="399" y="496" font-size="16" fill="#2B2F3A">C# / .NET API</text>
    <circle cx="385" cy="521" r="4" fill="#00A1BA" /><text x="399" y="526" font-size="16" fill="#2B2F3A">A small, reviewable diff</text>
  </g>

  <!-- Card 3: Test gate (highlighted) -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="670" y="250" width="260" height="330" rx="20" fill="#FFFFFF" stroke="#FF2400" stroke-width="4" />
    <circle cx="714" cy="300" r="24" fill="#FF2400" />
    <text x="714" y="309" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="694" y="380" font-size="28" font-weight="700" fill="#181A1F">Test gate</text>
    <text x="694" y="408" font-size="16" fill="#4B5060">Tests must pass</text>
    <line x1="694" y1="428" x2="906" y2="428" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="700" cy="461" r="4" fill="#FF2400" /><text x="714" y="466" font-size="16" fill="#2B2F3A">Vitest component tests</text>
    <circle cx="700" cy="491" r="4" fill="#FF2400" /><text x="714" y="496" font-size="16" fill="#2B2F3A">xUnit API tests</text>
    <circle cx="700" cy="521" r="4" fill="#FF2400" /><text x="714" y="526" font-size="16" font-weight="700" fill="#2B2F3A">Red = nothing ships</text>
  </g>

  <!-- Card 4: Pull request -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="985" y="250" width="260" height="330" rx="20" fill="#FFFFFF" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="1029" cy="300" r="24" fill="#234BFF" />
    <text x="1029" y="309" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="1009" y="380" font-size="28" font-weight="700" fill="#181A1F">Merge</text>
    <text x="1009" y="408" font-size="16" fill="#4B5060">Review and ship</text>
    <line x1="1009" y1="428" x2="1221" y2="428" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="1015" cy="461" r="4" fill="#234BFF" /><text x="1029" y="466" font-size="16" fill="#2B2F3A">You approve the change</text>
    <circle cx="1015" cy="491" r="4" fill="#234BFF" /><text x="1029" y="496" font-size="16" fill="#2B2F3A">PR opened and merged</text>
    <circle cx="1015" cy="521" r="4" fill="#234BFF" /><text x="1029" y="526" font-size="16" fill="#2B2F3A">Images built to ACR</text>
  </g>

  <!-- Card 5: Production -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="1300" y="250" width="260" height="330" rx="20" fill="#FFFFFF" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="1344" cy="300" r="24" fill="#002A31" />
    <text x="1344" y="309" font-size="24" font-weight="700" fill="#C3FFE0" text-anchor="middle">5</text>
    <text x="1324" y="380" font-size="28" font-weight="700" fill="#181A1F">Production</text>
    <text x="1324" y="408" font-size="16" fill="#4B5060">Live on Azure</text>
    <line x1="1324" y1="428" x2="1536" y2="428" stroke="#E2E2D6" stroke-width="2" />
    <circle cx="1330" cy="461" r="4" fill="#007485" /><text x="1344" y="466" font-size="16" fill="#2B2F3A">Azure Container Apps</text>
    <circle cx="1330" cy="491" r="4" fill="#007485" /><text x="1344" y="496" font-size="16" fill="#2B2F3A">GitHub Actions + OIDC</text>
    <circle cx="1330" cy="521" r="4" fill="#007485" /><text x="1344" y="526" font-size="16" fill="#2B2F3A">Zoom in to see more</text>
  </g>

  <!-- Bottom left: environments -->
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <rect x="40" y="640" width="560" height="210" rx="20" fill="#FFFFFF" stroke="#E2E2D6" stroke-width="2" />
    <text x="68" y="684" font-size="22" font-weight="700" fill="#181A1F">Three environments</text>

    <rect x="68" y="706" width="74" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE" />
    <text x="105" y="727" font-size="14" font-weight="700" fill="#0C2DC1" text-anchor="middle">DEV</text>
    <text x="160" y="727" font-size="16" fill="#2B2F3A">localhost:3000 · the branch you are working on</text>

    <rect x="68" y="750" width="74" height="30" rx="15" fill="#D4FAFF" stroke="#00D0F0" />
    <text x="105" y="771" font-size="14" font-weight="700" fill="#004752" text-anchor="middle">TEST</text>
    <text x="160" y="771" font-size="16" fill="#2B2F3A">localhost:3001 · the gate before anything ships</text>

    <rect x="68" y="794" width="74" height="30" rx="15" fill="#C3FFE0" stroke="#7BE0A8" />
    <text x="105" y="815" font-size="14" font-weight="700" fill="#002A31" text-anchor="middle">PROD</text>
    <text x="160" y="815" font-size="16" fill="#2B2F3A">Azure, West Europe · the real thing</text>
  </g>

  <!-- Bottom right: terminal -->
  <rect x="640" y="640" width="920" height="210" rx="20" fill="#181A1F" />
  <circle cx="672" cy="668" r="7" fill="#FF2400" />
  <circle cx="696" cy="668" r="7" fill="#F5C542" />
  <circle cx="720" cy="668" r="7" fill="#3DDC97" />
  <g font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="672" y="716" fill="#F5F5ED">$ docker compose -p aiworkshop-test run --rm frontend-tests</text>
    <text x="672" y="748" fill="#C3FFE0">✓ opens a zoom dialog when the magnifier is clicked</text>
    <text x="672" y="776" fill="#C3FFE0">✓ closes the dialog with the close button and Escape</text>
    <text x="672" y="804" fill="#C3FFE0">✓ renders every message in the list</text>
    <text x="672" y="832" fill="#00D0F0">Gate open: all tests passed, safe to ship</text>
  </g>
</svg>
